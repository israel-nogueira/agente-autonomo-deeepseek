<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Notificação</title>
    <style>
        :root {
            --bg: #0c1017;
            --surface: #151c27;
            --border: #253041;
            --text: #e8edf5;
            --muted: #96a6bc;
            --green: #7fd3ad;
            --blue: #598cff;
            --amber: #f0b64f;
            --red: #f08a8a;
            --font: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            color: var(--text);
            font: 13px/1.5 var(--font);
            user-select: none;
            -webkit-user-select: none;
        }

        .wrap {
            width: 100%;
            height: 100%;
            padding: 10px;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
        }

        .card {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 38px 14px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.55);
            cursor: pointer;
            overflow: hidden;
            animation: toast-in 250ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
        }

        .card.kind-done {
            border-left: 3px solid var(--green);
        }

        .card.kind-approval {
            border-left: 3px solid var(--amber);
        }

        .card.kind-error {
            border-left: 3px solid var(--red);
        }

        @keyframes toast-in {
            from {
                transform: translateX(28px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card {
                animation: none;
            }

            .icon.approval::after {
                animation: none !important;
            }
        }

        .icon {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(127, 211, 173, 0.12);
            border: 1px solid rgba(127, 211, 173, 0.45);
            color: var(--green);
            position: relative;
        }

        .icon.done {
            background: rgba(127, 211, 173, 0.12);
            border-color: rgba(127, 211, 173, 0.45);
            color: var(--green);
        }

        .icon.approval {
            background: rgba(240, 182, 79, 0.12);
            border-color: rgba(240, 182, 79, 0.45);
            color: var(--amber);
        }

        .icon.approval::after {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid rgba(240, 182, 79, 0.55);
            animation: approval-pulse 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes approval-pulse {
            0% {
                transform: scale(0.95);
                opacity: 0.9;
            }

            70% {
                transform: scale(1.25);
                opacity: 0;
            }

            100% {
                transform: scale(1.25);
                opacity: 0;
            }
        }

        .icon.error {
            background: rgba(240, 138, 138, 0.12);
            border-color: rgba(240, 138, 138, 0.45);
            color: var(--red);
        }

        .icon svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .content {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.1px;
        }

        .project {
            font-size: 12px;
            color: var(--text);
            opacity: 0.9;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .meta {
            font-size: 11px;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .message {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            align-self: flex-start;
            margin-top: 4px;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(240, 182, 79, 0.55);
            background: rgba(240, 182, 79, 0.15);
            color: var(--amber);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .action:hover {
            background: rgba(240, 182, 79, 0.25);
            color: #ffe0a3;
        }

        .close {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 24px;
            height: 24px;
            padding: 0;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            font-size: 14px;
            line-height: 1;
            display: grid;
            place-items: center;
            cursor: pointer;
        }

        .close:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
        }

        .progress {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: var(--green);
            transform-origin: left center;
            transform: scaleX(1);
            transition: transform 0ms linear;
        }

        .progress-bar.error {
            background: var(--red);
        }

        .hide {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="card" id="card" role="button" tabindex="0" aria-label="Abrir">
            <span class="icon done" id="icon" aria-hidden="true">
                <svg id="icon-svg" viewBox="0 0 24 24">
                    <path d="M4 12.5 10 18l10-11" />
                </svg>
            </span>
            <div class="content">
                <div class="title" id="title">Tarefa concluída</div>
                <div class="project" id="project"></div>
                <div class="meta" id="meta"></div>
                <div class="message hide" id="message"></div>
                <button type="button" class="action hide" id="action">Revisar agora</button>
            </div>
            <button type="button" class="close" id="close" aria-label="Fechar">✕</button>
            <div class="progress" id="progress">
                <div class="progress-bar" id="bar"></div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);

            var KINDS = ['done', 'approval', 'error'];
            var kindRaw = params.get('kind') || '';
            var kind = KINDS.indexOf(kindRaw) !== -1 ? kindRaw : 'done';

            var project = params.get('project') || '';
            var filesRaw = params.get('files');
            var duration = params.get('duration') || '';
            var message = params.get('message') || '';
            var countRaw = params.get('count');

            var files = 0;
            if (filesRaw !== null && filesRaw !== '') {
                var n = parseInt(filesRaw, 10);
                if (isFinite(n) && n > 0) files = n;
            }

            var count = 0;
            if (countRaw !== null && countRaw !== '') {
                var c = parseInt(countRaw, 10);
                if (isFinite(c) && c > 0) count = c;
            }

            var cardEl = document.getElementById('card');
            var iconEl = document.getElementById('icon');
            var iconSvg = document.getElementById('icon-svg');
            var titleEl = document.getElementById('title');
            var projectEl = document.getElementById('project');
            var metaEl = document.getElementById('meta');
            var messageEl = document.getElementById('message');
            var actionEl = document.getElementById('action');
            var closeEl = document.getElementById('close');
            var progressEl = document.getElementById('progress');
            var barEl = document.getElementById('bar');

            var ICON_CHECK = '<path d="M4 12.5 10 18l10-11" />';
            var ICON_HAND = '<path d="M12 3v6M8 9V7a2 2 0 1 1 4 0v2M12 9V6a2 2 0 1 1 4 0v3M16 9V8a2 2 0 1 1 4 0v6a7 7 0 0 1-7 7H9a4 4 0 0 1-4-4v-3l-1.5-2a1.8 1.8 0 0 1 3-2L8 12" />';
            var ICON_X = '<path d="M6 6l12 12M18 6L6 18" />';

            var TOTAL_MS = 0;
            var showProgress = false;

            cardEl.classList.add('kind-' + kind);

            if (kind === 'done') {
                iconEl.className = 'icon done';
                iconSvg.innerHTML = ICON_CHECK;
                titleEl.textContent = 'Tarefa concluída';
                TOTAL_MS = 8000;
                showProgress = true;
                barEl.className = 'progress-bar';
            } else if (kind === 'approval') {
                iconEl.className = 'icon approval';
                iconSvg.innerHTML = ICON_HAND;
                titleEl.textContent = 'Aguardando sua aprovação';
                TOTAL_MS = 0;
                showProgress = false;
                progressEl.classList.add('hide');

                if (count > 0) {
                    metaEl.textContent = count + (count === 1 ? ' comando esperando o seu OK' : ' comandos esperando o seu OK');
                } else {
                    metaEl.classList.add('hide');
                }

                actionEl.classList.remove('hide');
                actionEl.addEventListener('click', function (ev) {
                    ev.stopPropagation();
                    try { window.toastAPI.open(); } catch (e) { }
                });
            } else if (kind === 'error') {
                iconEl.className = 'icon error';
                iconSvg.innerHTML = ICON_X;
                titleEl.textContent = 'A tarefa falhou';
                TOTAL_MS = 12000;
                showProgress = true;
                barEl.className = 'progress-bar error';

                if (message) {
                    messageEl.textContent = message;
                    messageEl.classList.remove('hide');
                }
            }

            if (project) projectEl.textContent = project;
            else projectEl.classList.add('hide');

            if (kind === 'done') {
                var parts = [];
                if (files > 0) {
                    parts.push(files + (files === 1 ? ' arquivo alterado' : ' arquivos alterados'));
                }
                if (duration) parts.push(duration);
                if (parts.length > 0) metaEl.textContent = parts.join(' · ');
                else metaEl.classList.add('hide');
            }

            var remainingMs = TOTAL_MS;
            var startedAt = 0;
            var timer = null;
            var paused = false;

            function renderBar(ms) {
                if (!showProgress) return;
                var ratio = TOTAL_MS > 0 ? Math.max(0, Math.min(1, ms / TOTAL_MS)) : 0;
                barEl.style.transform = 'scaleX(' + ratio + ')';
            }

            function scheduleNext(ms) {
                if (timer) clearTimeout(timer);
                if (ms <= 0) return;
                timer = setTimeout(function () {
                    timer = null;
                    try { window.toastAPI.close(); } catch (e) { }
                }, ms);
            }

            function start() {
                paused = false;
                startedAt = Date.now();
                renderBar(remainingMs);
                if (showProgress) scheduleNext(remainingMs);
            }

            function pause() {
                if (!showProgress) return;
                if (paused) return;
                paused = true;
                if (timer) { clearTimeout(timer); timer = null; }
                var elapsed = Date.now() - startedAt;
                remainingMs = Math.max(0, remainingMs - elapsed);
            }

            function resume() {
                if (!showProgress) return;
                if (!paused) return;
                start();
            }

            cardEl.addEventListener('mouseenter', pause);
            cardEl.addEventListener('mouseleave', resume);

            cardEl.addEventListener('click', function () {
                try { window.toastAPI.open(); } catch (e) { }
            });

            cardEl.addEventListener('keydown', function (ev) {
                if (ev.key === 'Enter' || ev.key === ' ') {
                    ev.preventDefault();
                    try { window.toastAPI.open(); } catch (e) { }
                }
            });

            closeEl.addEventListener('click', function (ev) {
                ev.stopPropagation();
                try { window.toastAPI.close(); } catch (e) { }
            });

            if (showProgress) {
                start();
            }
        })();
    </script>
</body>

</html>
