name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencias Linux
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg

      - name: npm ci
        run: npm ci

      - name: Criar pasta de icones do app
        shell: bash
        run: mkdir -p renderer/icons/app

      - name: Copiar favicon.png (todas as plataformas)
        shell: bash
        run: cp renderer/icons/Android/play_store_512.png renderer/icons/app/favicon.png

      - name: Gerar favicon.ico (Windows)
        if: matrix.target == 'win'
        shell: bash
        run: |
          if [ -f renderer/icons/Web/favicon.ico ]; then
            cp renderer/icons/Web/favicon.ico renderer/icons/app/favicon.ico
          else
            echo "ERRO: renderer/icons/Web/favicon.ico nao encontrado"
            exit 1
          fi

      - name: Gerar favicon.icns (macOS)
        if: matrix.target == 'mac'
        run: iconutil -c icns renderer/icons/macOS/AppIcon.iconset -o renderer/icons/app/favicon.icns

      - name: Build Windows
        if: matrix.target == 'win'
        run: npx electron-forge make --platform win32 --targets @electron-forge/maker-squirrel @electron-forge/maker-zip

      - name: Build Linux
        if: matrix.target == 'linux'
        run: npx electron-forge make --platform linux --targets @electron-forge/maker-deb @electron-forge/maker-rpm @electron-forge/maker-zip

      - name: Build macOS
        if: matrix.target == 'mac'
        run: npx electron-forge make --platform darwin --targets @electron-forge/maker-zip

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: opendeepseek-${{ matrix.target }}
          path: out/make/**
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.nupkg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false